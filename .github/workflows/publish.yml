name: publish

# 手动触发：发布到 npm 时用（Actions 页面点 Run workflow）。
# 需要先在仓库 Settings → Secrets 里配好 NPM_TOKEN。
# 不绑定 tag，是因为我们目前走 GitHub 分发（Release + git 源），不需要每次打 tag 就要求 npm 凭据。
on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # 先在临时 DSH_HOME 上跑一遍完整流水线，不碰真实会话数据
      - name: 自测
        run: node test/selftest.mjs

      - name: 生成发布产物
        run: node scripts/pack.mjs

      - name: 发布到 npm
        working-directory: dist/@liubaibuliuyan/dsh-session-delete
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
